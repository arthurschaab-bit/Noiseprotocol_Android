name: Android Emulator Tests

# PR/Push/Dispatch und Concurrency werden nur im Parent androidci.yml verwaltet.
on:
  workflow_call:
    secrets:
      DEBUG_KEYSTORE_BASE64:
        required: false

permissions:
  contents: read

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        api-level: [34]
    env:
      ORG_GRADLE_PROJECT_buildSha: ${{ github.event.pull_request.head.sha || github.sha }}
      ORG_GRADLE_PROJECT_buildPrNumber: ${{ github.event.pull_request.number }}
      ORG_GRADLE_PROJECT_buildCiRun: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Zeitmessung starten
        run: python3 .github/scripts/ci-timing.py init

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python 3.11 (Chaquopy build requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug-Keystore aus Secret wiederherstellen
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "ORG_GRADLE_PROJECT_debugStoreFile=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Test APKs
        id: apks
        run: python .github/scripts/ci-timing.py run "APK-Build" -- ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Gleicher Download fuer Geraetetests, sofort nach dem erfolgreichen Build.
      - name: Debug-APK bereitstellen
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Emulator-Zeitmessung starten
        run: python .github/scripts/ci-timing.py start "Emulator gesamt (Setup, Tests, Teardown)"

      - name: Run Instrumented Android Tests on Emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: bash .github/scripts/run-instrumented-tests.sh ${{ matrix.api-level }}

      - name: Emulator-Zeitmessung abschliessen
        if: ${{ !cancelled() && steps.emulator.outcome != 'skipped' }}
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: python .github/scripts/ci-timing.py end "Emulator gesamt (Setup, Tests, Teardown)" "$EMULATOR_OUTCOME"

      - name: Debug-Keystore-Kopie loeschen
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Testbericht in die Zusammenfassung schreiben
        if: ${{ !cancelled() }}
        run: python .github/scripts/testbericht.py "Instrumentierte Tests (Emulator API ${{ matrix.api-level }})" "app/build/outputs/androidTest-results" >> "$GITHUB_STEP_SUMMARY"

      # Kein ADB-Aufruf nach dem Teardown. Der EXIT-Trap im Skript sichert Live-Diagnosen.
      - name: Upload Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logs/permission-tests/
          retention-days: 7

      - name: Upload ADB Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: logs/
          retention-days: 7

      - name: Laufzeiten zusammenfassen
        if: ${{ !cancelled() }}
        run: python .github/scripts/ci-timing.py summary >> "$GITHUB_STEP_SUMMARY"
