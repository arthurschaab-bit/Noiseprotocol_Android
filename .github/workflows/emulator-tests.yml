name: Android Emulator Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        api-level: [34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Pre-build Debug and Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run Instrumented Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: |
            adb wait-for-device
            adb shell input keyevent 82 || true
            adb logcat -c

            # Die vier "ohneBerechtigung..."-Tests unten (revoke-Berechtigungsnachweis fuer #129-
            # artige Fehler, siehe BerechtigungsTestHelfer-KDoc) laufen HIER NICHT mit: AGP gewaehrt
            # beim Install alle im Manifest deklarierten Laufzeitberechtigungen bereits (`pm install
            # -g`), ein Revoke waehrend dieses Laufs wuerde den instrumentierten Prozess toeten und
            # den gesamten restlichen Testlauf mitreissen (CI-Fund 10.09.2026, PR #132). Sie laufen
            # stattdessen weiter unten einzeln per `adb shell am instrument`, jeweils nach einem
            # `pm revoke` VOR dem Prozessstart - deshalb im selben Emulator-Schritt wie hier: ein
            # zweiter `reactivecircus/android-emulator-runner`-Schritt wuerde einen FRISCHEN
            # Emulator ohne die hier installierten APKs starten.
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.lrmprotokoll.ui.FotoDokumentationSheetPermissionInstrumentedTest#ohneBerechtigungFragtDerAufnahmeButtonErstNachUndStartetDannDenKameraIntent,com.example.lrmprotokoll.ui.VideoAufnahmeScreenPermissionInstrumentedTest#ohneBerechtigungFragtDerScreenBeimBetretenNachUndSchaltetNachErlaubnisWeiter,com.example.lrmprotokoll.ui.GesamtberichtStammdatenSheetPermissionInstrumentedTest#ohneBerechtigungFragtStandortErmittelnErstNachUndHaengtNichtEndlosImLadezustand,com.example.lrmprotokoll.ui.MeterScreenPermissionInstrumentedTest#ohneBerechtigungFragtDerScanButtonErstNachUndBesitztDanachDieBerechtigung \
              || (timeout 10s adb logcat -d > logcat-failure.txt && exit 1)

            APP_ID="com.example.lrmprotokoll"
            RUNNER=$(adb shell pm list instrumentation | grep "target=$APP_ID" | sed -E 's/instrumentation:([^ ]+) .*/\1/' | tr -d '\r')
            if [ -z "$RUNNER" ]; then
              echo "::error::Keine Instrumentation fuer $APP_ID gefunden (pm list instrumentation leer) - App-/Test-APK nicht installiert?"
              exit 1
            fi
            echo "Instrumentation-Komponente: $RUNNER"

            # Format je Eintrag: "<Klasse>#<Methode>|<Berechtigung1>[,<Berechtigung2>]"
            faelle=(
              "com.example.lrmprotokoll.ui.FotoDokumentationSheetPermissionInstrumentedTest#ohneBerechtigungFragtDerAufnahmeButtonErstNachUndStartetDannDenKameraIntent|android.permission.CAMERA"
              "com.example.lrmprotokoll.ui.VideoAufnahmeScreenPermissionInstrumentedTest#ohneBerechtigungFragtDerScreenBeimBetretenNachUndSchaltetNachErlaubnisWeiter|android.permission.CAMERA"
              "com.example.lrmprotokoll.ui.GesamtberichtStammdatenSheetPermissionInstrumentedTest#ohneBerechtigungFragtStandortErmittelnErstNachUndHaengtNichtEndlosImLadezustand|android.permission.ACCESS_COARSE_LOCATION"
            )
            # BLUETOOTH_SCAN/BLUETOOTH_CONNECT gibt es erst ab API 31 (Legacy-Pfad davor laeuft
            # ueber ACCESS_FINE_LOCATION) - der Test selbst ueberspringt sich unterhalb von API 31
            # per assumeTrue(), was am-instrument NICHT als "OK (1 test)" meldet. Deshalb hier
            # bereits ausgelassen, statt faelschlich als Fehlschlag gewertet zu werden.
            if [ "${{ matrix.api-level }}" -ge 31 ]; then
              faelle+=("com.example.lrmprotokoll.ui.MeterScreenPermissionInstrumentedTest#ohneBerechtigungFragtDerScanButtonErstNachUndBesitztDanachDieBerechtigung|android.permission.BLUETOOTH_SCAN,android.permission.BLUETOOTH_CONNECT")
            fi

            fehlgeschlagen=0
            for eintrag in "${faelle[@]}"; do
              klasse_methode="${eintrag%%|*}"
              berechtigungen="${eintrag##*|}"
              echo "::group::$klasse_methode (revoke: $berechtigungen)"

              # Kein laufender Prozess = kein Kill-Risiko beim Revoke (siehe oben).
              adb shell am force-stop "$APP_ID" || true
              IFS=',' read -ra perms <<< "$berechtigungen"
              for p in "${perms[@]}"; do
                adb shell pm revoke "$APP_ID" "$p" || true
              done

              ausgabe=$(adb shell am instrument -w -e class "$klasse_methode" "$RUNNER" 2>&1)
              echo "$ausgabe"

              for p in "${perms[@]}"; do
                adb shell pm grant "$APP_ID" "$p" || true
              done

              if ! echo "$ausgabe" | grep -q "OK (1 test)"; then
                echo "::error::$klasse_methode ist NICHT mit 'OK (1 test)' durchgelaufen (siehe Ausgabe oben)."
                fehlgeschlagen=1
              fi
              echo "::endgroup::"
            done

            if [ "$fehlgeschlagen" -ne 0 ]; then
              timeout 10s adb logcat -d > logcat-failure.txt
              exit 1
            fi

      - name: Testbericht in die Zusammenfassung schreiben
        if: always()
        run: python3 .github/scripts/testbericht.py "Instrumentierte Tests (Emulator API ${{ matrix.api-level }})" "app/build/outputs/androidTest-results" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Collect ADB Logs
        if: always()
        run: |
          mkdir -p logs
          timeout 10s adb logcat -d > logs/adb-logcat.txt 2>/dev/null || true
          timeout 10s adb shell dumpsys activity > logs/dumpsys-activity.txt 2>/dev/null || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

      - name: Upload ADB Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: |
            logs/
            logcat-failure.txt
          retention-days: 7
