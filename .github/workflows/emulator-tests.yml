name: Android Emulator Tests

# PR/Push/Dispatch und Concurrency werden nur im Parent androidci.yml verwaltet.
on:
  workflow_call:
    secrets:
      DEBUG_KEYSTORE_BASE64:
        required: false

permissions:
  contents: read

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        api-level: [34]
    env:
      ORG_GRADLE_PROJECT_buildSha: ${{ github.event.pull_request.head.sha || github.sha }}
      ORG_GRADLE_PROJECT_buildPrNumber: ${{ github.event.pull_request.number }}
      ORG_GRADLE_PROJECT_buildCiRun: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Zeitmessung starten
        run: python3 .github/scripts/ci-timing.py init

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python 3.11 (Chaquopy build requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug-Keystore aus Secret wiederherstellen
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "ORG_GRADLE_PROJECT_debugStoreFile=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Test APKs
        id: apks
        run: python .github/scripts/ci-timing.py run "APK-Build" -- ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Gleicher Download fuer Geraetetests, sofort nach dem erfolgreichen Build.
      - name: Debug-APK bereitstellen
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Emulator-Zeitmessung starten
        run: python .github/scripts/ci-timing.py start "Emulator gesamt (Setup, Tests, Teardown)"

      - name: Run Instrumented Android Tests on Emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Historie dieser Zeile, damit sie niemand versehentlich zurueckdreht:
          #
          # Bis 25.09.2026 stand hier aosp_atd. Ein Automated Test Device bringt bewusst keine
          # SystemUI mit - ohne SystemUI keine Statusleiste, kein statusBars-Inset, und
          # SystemLeistenAbstandInstrumentedTest hat sich in drei Laeufen ueber seine
          # assumeTrue-Schranke weggeskippt, ohne etwas zu pruefen.
          #
          # Auf Owner-Entscheidung wurde deshalb auf google_apis umgestellt. Das hat seinen
          # Zweck erfuellt: Im Lauf 36169220008 ist der Test erstmals wirklich gelaufen und war
          # GRUEN - der Titel des Startbildschirms beginnt unterhalb der Statusleiste. Der Punkt
          # "System-Insets" aus Audit-Kapitel 35.1 ist damit beantwortet.
          #
          # google_apis bringt aber nicht nur SystemUI mit, sondern auch die Google-Dienste. Die
          # blenden Systemdialoge ueber die App und nehmen ihr den Fensterfokus: Im Lauf
          # 36181486631 fielen 13 bestehende Tests aus, neun davon mit
          # RootViewWithoutFocusException ("Waited for the root of the view hierarchy to have
          # window focus"). Da die Frage beantwortet ist, kostet das Bild ab jetzt 13 kaputte
          # Tests ohne zusaetzlichen Erkenntnisgewinn - deshalb zurueck auf aosp_atd.
          #
          # Wer den Insets-Test dauerhaft scharf haben will, nimmt `default` statt google_apis:
          # AOSP MIT SystemUI, aber ohne Google-Dienste. Das ist ungetestet und waere ein
          # eigener Versuch wert.
          target: aosp_atd
          arch: x86_64
          # Ohne `profile` erzeugt avdmanager ein Geraet mit 320x640 - eine Bildschirmgroesse,
          # die es bei heutigen Telefonen nicht gibt (das schmalste liegt bei rund 360 dp). Mit
          # aosp_atd fiel das nie auf, weil dieses Bild keine SystemUI und damit keine Status-
          # und Navigationsleiste mitbringt. Mit google_apis kosten die Leisten auf 640 px Hoehe
          # ueber 10 Prozent des Platzes: 14 bestehende Tests fielen aus, neun davon mit
          # "performScrollTo() failed" (Lauf 36169220008). Ein festes, realistisches Profil macht
          # die Geometrie unabhaengig vom Systemabbild und reproduzierbar.
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: bash .github/scripts/run-instrumented-tests.sh ${{ matrix.api-level }}

      - name: Emulator-Zeitmessung abschliessen
        if: ${{ !cancelled() && steps.emulator.outcome != 'skipped' }}
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: python .github/scripts/ci-timing.py end "Emulator gesamt (Setup, Tests, Teardown)" "$EMULATOR_OUTCOME"

      - name: Debug-Keystore-Kopie loeschen
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Testbericht in die Zusammenfassung schreiben
        if: ${{ !cancelled() }}
        run: python .github/scripts/testbericht.py "Instrumentierte Tests (Emulator API ${{ matrix.api-level }})" "app/build/outputs/androidTest-results" >> "$GITHUB_STEP_SUMMARY"

      # Kein ADB-Aufruf nach dem Teardown. Der EXIT-Trap im Skript sichert Live-Diagnosen.
      - name: Upload Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logs/permission-tests/
          retention-days: 7

      - name: Upload ADB Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: logs/
          retention-days: 7

      - name: Laufzeiten zusammenfassen
        if: ${{ !cancelled() }}
        run: python .github/scripts/ci-timing.py summary >> "$GITHUB_STEP_SUMMARY"
