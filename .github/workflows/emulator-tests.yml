name: Android Emulator Tests

on:
  pull_request:
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/**'
      - '.github/workflows/emulator-tests.yml'
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api-level: [34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Pre-build Debug and Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run Instrumented Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: |
            adb logcat -c
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace || (adb logcat -d > logcat-failure.txt && exit 1)

      - name: Collect ADB Logs
        if: always()
        run: |
          mkdir -p logs
          adb logcat -d > logs/adb-logcat.txt 2>/dev/null || true
          adb shell dumpsys activity > logs/dumpsys-activity.txt 2>/dev/null || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

      - name: Upload ADB Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: |
            logs/
            logcat-failure.txt
          retention-days: 7
