name: Emulator Flake Diagnose

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Klasse oder Klasse#Methode, mehrere mit Komma trennen'
        required: true
        type: string
      wiederholungen:
        description: 'Wiederholungen pro Test (1 bis 100)'
        required: true
        default: '20'
        type: string
      api_level:
        description: 'Android API-Level'
        required: true
        default: '34'
        type: string

concurrency:
  group: flake-diagnose-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python 3.11 (Chaquopy build requirement)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Eingaben prüfen
        env:
          TESTS: ${{ inputs.tests }}
          WIEDERHOLUNGEN: ${{ inputs.wiederholungen }}
          API_LEVEL: ${{ inputs.api_level }}
        run: bash .github/scripts/wiederhole-instrumentierte-tests.sh --validate
      - name: Pre-build Debug and Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Run repeated tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TESTS: ${{ inputs.tests }}
          WIEDERHOLUNGEN: ${{ inputs.wiederholungen }}
          API_LEVEL: ${{ inputs.api_level }}
        with:
          api-level: ${{ inputs.api_level }}
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: bash .github/scripts/wiederhole-instrumentierte-tests.sh
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-diagnostics-api-${{ inputs.api_level }}
          path: diagnose/
          if-no-files-found: ignore
          retention-days: 7
