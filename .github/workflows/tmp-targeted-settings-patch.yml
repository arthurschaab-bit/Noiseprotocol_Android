name: Temporary targeted settings patch

on:
  push:
    branches: [fix/instrumented-test-gaps]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instrumented-test-gaps
          fetch-depth: 0
      - name: Apply narrow SettingsScreen fixes and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/lrmprotokoll/ui/SettingsScreen.kt')
          s = p.read_text()
          old = '''                                    if (it && ntfyTopic.isBlank()) {
                                        settings.ntfyTopic = ntfyTopic
                                    }'''
          new = '''                                    if (it && ntfyTopic.isBlank()) {
                                        ntfyTopic = erzeugeNtfyTopic()
                                        settings.ntfyTopic = ntfyTopic
                                    }'''
          if old not in s:
              raise SystemExit('ntfy target block not found')
          s = s.replace(old, new, 1)

          old_slider = '''                    onValueChangeFinished = { settings.dbThreshold = dbThreshold },
                    valueRange = 30f..100f
                )'''
          new_slider = '''                    onValueChangeFinished = { settings.dbThreshold = dbThreshold },
                    valueRange = 30f..100f,
                    modifier = Modifier.testTag("slider_db_threshold"),
                )'''
          if old_slider not in s:
              raise SystemExit('db slider target block not found')
          s = s.replace(old_slider, new_slider, 1)

          old_switch = '''                                onCheckedChange = {
                                    ntfyAktiv = it
                                    settings.ntfyAktiv = it
                                    if (it && ntfyTopic.isBlank()) {
                                        ntfyTopic = erzeugeNtfyTopic()
                                        settings.ntfyTopic = ntfyTopic
                                    }
                                },
                            )'''
          new_switch = '''                                onCheckedChange = {
                                    ntfyAktiv = it
                                    settings.ntfyAktiv = it
                                    if (it && ntfyTopic.isBlank()) {
                                        ntfyTopic = erzeugeNtfyTopic()
                                        settings.ntfyTopic = ntfyTopic
                                    }
                                },
                                modifier = Modifier.testTag("switch_ntfy_enabled"),
                            )'''
          if old_switch not in s:
              raise SystemExit('ntfy switch target block not found')
          p.write_text(s.replace(old_switch, new_switch, 1))
          PY
          git rm .github/workflows/tmp-targeted-settings-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/lrmprotokoll/ui/SettingsScreen.kt
          git commit -m "fix(settings): restore ntfy topic generation and add stable tags"
          git push origin HEAD:fix/instrumented-test-gaps
