name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run ktlint
        id: ktlint
        continue-on-error: true
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      # Explizit der im instrumentierten Testplan/Review geforderte Debug-Task. --continue sorgt
      # dafür, dass bei mehreren Fehlern der Bericht nicht am ersten Test abbricht.
      - name: Unit & Robolectric Tests (Debug)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue

      - name: Testbericht in die Zusammenfassung schreiben
        if: always()
        run: python3 .github/scripts/testbericht.py "JVM & Robolectric Testbericht" "app/build/test-results" >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage-Report erzeugen
        if: always()
        continue-on-error: true
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug --no-daemon --stacktrace

      - name: Coverage in die Zusammenfassung schreiben
        if: always()
        run: python3 .github/scripts/coverage.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          retention-days: 7

      - name: Upload ktlint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: app/build/reports/ktlint/
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Coverage-Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/reportDebug.xml
            app/build/reports/kover/htmlDebug/
          retention-days: 7

      - name: Debug-APK bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
