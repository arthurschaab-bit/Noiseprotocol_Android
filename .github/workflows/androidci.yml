name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Vollstaendiger Git-Diff ohne Dateilimit, inklusive PR-Merge-Base.
          fetch-depth: 0
      - name: CI-Umfang bestimmen
        id: changes
        run: python3 .github/scripts/ci-changes.py

  build-and-test:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Konstante Versionsinputs in ALLEN Gradle-Aufrufen verhindern Neukompilierung.
      ORG_GRADLE_PROJECT_buildSha: ${{ github.event.pull_request.head.sha || github.sha }}
      ORG_GRADLE_PROJECT_buildPrNumber: ${{ github.event.pull_request.number }}
      ORG_GRADLE_PROJECT_buildCiRun: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Zeitmessung starten
        run: python3 .github/scripts/ci-timing.py init

      - name: CI-Skripte testen
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Set up Python 3.11 (Chaquopy build requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test-python.txt

      - name: Portable Python-Berichtslogik testen
        run: |
          python .github/scripts/ci-timing.py run "Python-Abhaengigkeiten" -- python -m pip install -r requirements-test-python.txt
          python .github/scripts/ci-timing.py run "Python-Tests" -- python -m pytest app/src/test/python/ --junitxml=logs/python-tests.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Set up Gradle (with cache)
        id: gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Gemessener Taskgraph: test enthaelt testDebugUnitTest UND checkUnusedDaoMethods.
      # APK-Paketierung und AndroidTest-Kompilierung erfolgen ausschliesslich im Heavy Gate.
      - name: Unit & Robolectric Tests
        id: unit
        run: python .github/scripts/ci-timing.py run "JVM/Robolectric inklusive Compile" -- ./gradlew test --stacktrace --continue

      # Lint und Testbericht laufen auch nach Unit-Test-Fehlern weiter, um vollstaendige Fehlerdiagnosen bereitzustellen.
      - name: Run Android Lint
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: python .github/scripts/ci-timing.py run "Android Lint" -- ./gradlew lintDebug --stacktrace

      # Bekannte Stil-Verstoesse bleiben wie bisher sichtbar und nicht blockierend.
      - name: Run ktlint
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        continue-on-error: true
        run: python .github/scripts/ci-timing.py run "ktlint (informativ)" -- ./gradlew ktlintCheck --stacktrace

      - name: Testbericht in die Zusammenfassung schreiben
        if: ${{ !cancelled() }}
        run: python .github/scripts/testbericht.py "JVM & Robolectric Testbericht" "app/build/test-results" >> "$GITHUB_STEP_SUMMARY"

      # Keine Wiederholung fehlgeschlagener Tests fuer einen rein informativen Report:
      # Nach erfolgreichen Tests verwendet Kover dieselben UP-TO-DATE-Ergebnisse.
      # Bei fehlgeschlagenen Unit-Tests wird Kover uebersprungen, da ein unvollstaendiger Report keinen Mehrwert bietet.
      - name: Coverage-Report erzeugen
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        continue-on-error: true
        run: python .github/scripts/ci-timing.py run "Coverage (informativ)" -- ./gradlew koverXmlReportDebug koverHtmlReportDebug --stacktrace

      - name: Coverage in die Zusammenfassung schreiben
        if: ${{ !cancelled() }}
        run: python .github/scripts/coverage.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lint Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          retention-days: 7

      - name: Upload ktlint Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: app/build/reports/ktlint/
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            logs/python-tests.xml
          retention-days: 7

      - name: Upload Coverage-Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/reportDebug.xml
            app/build/reports/kover/htmlDebug/
          retention-days: 7

      - name: Laufzeiten zusammenfassen
        if: ${{ !cancelled() }}
        run: python .github/scripts/ci-timing.py summary >> "$GITHUB_STEP_SUMMARY"

  emulator:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/emulator-tests.yml
    secrets:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

  ci-result:
    name: CI
    if: always()
    needs: [changes, build-and-test, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Stabiles Gesamtgate auch bei Docs-only; Fehler/Abbrueche bleiben rot.
      - name: Ergebnis pruefen
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          ANDROID: ${{ needs.changes.outputs.android }}
          FAST_RESULT: ${{ needs.build-and-test.result }}
          HEAVY_RESULT: ${{ needs.emulator.result }}
        run: |
          printf 'Fast Gate: %s; Heavy Gate: %s\n' "$FAST_RESULT" "$HEAVY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$SCOPE_RESULT" = success
          if [ "$ANDROID" = true ]; then
            test "$FAST_RESULT" = success
            test "$HEAVY_RESULT" = success
          else
            test "$ANDROID" = false
            test "$FAST_RESULT" = skipped
            test "$HEAVY_RESULT" = skipped
          fi
