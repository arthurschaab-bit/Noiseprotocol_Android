name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  # Manuell ausloesbar, damit ein Lauf nicht erst einen Commit braucht.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # --continue, damit ein fehlgeschlagener Test die uebrigen nicht abschneidet: Sonst zeigt
      # der Bericht nur den ersten Fehler und man braucht mehrere Laeufe, um das ganze Bild zu
      # sehen.
      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace --continue

      # Ohne diesen Schritt steht das Ergebnis nur im hochgeladenen Artefakt - man muss es
      # herunterladen und entpacken, um zu erfahren, welcher Test warum gescheitert ist. Hier
      # landet es direkt auf der Zusammenfassungsseite des Laufs.
      - name: Testbericht in die Zusammenfassung schreiben
        if: always()
        run: python3 .github/scripts/testbericht.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      # Erlaubt, eine PR-Fassung auf dem Telefon zu installieren, ohne sie selbst zu bauen:
      # Artefakt herunterladen, entpacken, `adb install -r app-debug.apk`.
      - name: Debug-APK bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
