name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manuell ausloesbar, damit ein Lauf nicht erst einen Commit braucht.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      # Testluecken-Auftrag Stufe 1: eigener Kotlin-Stil-Linter neben Android Lint (der prueft
      # Android-spezifische Dinge wie Ressourcen/API-Level, nicht Formatierung/Stil). Bestand hat
      # aktuell mehrere tausend Verstoesse (nie zuvor gegen ktlint gelaufen) - ein Vollformat-Pass
      # ist eine eigene, bewusst zu treffende Entscheidung, keine Nebenwirkung dieses Auftrags.
      # continue-on-error haelt den Schritt deshalb sichtbar (roter Status auf der Actions-Seite,
      # Report als Artefakt), blockiert aber den Job nicht.
      - name: Run ktlint
        id: ktlint
        continue-on-error: true
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      # --continue, damit ein fehlgeschlagener Test die uebrigen nicht abschneidet: Sonst zeigt
      # der Bericht nur den ersten Fehler und man braucht mehrere Laeufe, um das ganze Bild zu
      # sehen.
      - name: Unit & Robolectric Tests
        run: ./gradlew test --no-daemon --stacktrace --continue

      # Ohne diesen Schritt steht das Ergebnis nur im hochgeladenen Artefakt - man muss es
      # herunterladen und entpacken, um zu erfahren, welcher Test warum gescheitert ist. Hier
      # landet es direkt auf der Zusammenfassungsseite des Laufs.
      - name: Testbericht in die Zusammenfassung schreiben
        if: always()
        run: python3 .github/scripts/testbericht.py "JVM & Robolectric Testbericht" "app/build/test-results" >> "$GITHUB_STEP_SUMMARY"

      # Testluecken-Auftrag Stufe 1: Line-Coverage messen, damit die weiteren Stufen gegen eine
      # echte Zahl arbeiten statt zu schaetzen. continue-on-error: schlaegt schon
      # testDebugUnitTest fehl, soll das nicht als zweiter, redundanter roter Schritt erscheinen -
      # der Testbericht oben zeigt die eigentliche Ursache bereits.
      - name: Coverage-Report erzeugen
        if: always()
        continue-on-error: true
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug --no-daemon --stacktrace

      - name: Coverage in die Zusammenfassung schreiben
        if: always()
        run: python3 .github/scripts/coverage.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          retention-days: 7

      - name: Upload ktlint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: app/build/reports/ktlint/
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Coverage-Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/reportDebug.xml
            app/build/reports/kover/htmlDebug/
          retention-days: 7

      # Erlaubt, eine PR-Fassung auf dem Telefon zu installieren, ohne sie selbst zu bauen:
      # Artefakt herunterladen, entpacken, `adb install -r app-debug.apk`.
      - name: Debug-APK bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
